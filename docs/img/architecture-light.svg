<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14">
<rect width="1000" height="330" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker></defs>
<rect x="20" y="20" width="220" height="120" rx="8" fill="#f6f8fa" stroke="#59636e" stroke-width="1.8"/><text x="32" y="42" font-weight="600" fill="#1f2328">Binance public data</text><text x="32" y="62" font-size="12" fill="#59636e">USD-M futures, BTC and ETH</text><text x="32" y="78" font-size="12" fill="#59636e">bookTicker: 158.8M updates</text><text x="32" y="94" font-size="12" fill="#59636e">aggTrades: 19.5M (52.2M trades)</text><text x="32" y="110" font-size="12" fill="#59636e">SHA-256 verified</text>
<rect x="280" y="20" width="210" height="120" rx="8" fill="#f6f8fa" stroke="#2a78d6" stroke-width="1.8"/><text x="292" y="42" font-weight="600" fill="#1f2328">Loader (Polars)</text><text x="292" y="62" font-size="12" fill="#59636e">best bid/ask as of each 100 ms</text><text x="292" y="78" font-size="12" fill="#59636e">trades with taker side</text><text x="292" y="94" font-size="12" fill="#59636e">Parquet per symbol-day</text>
<rect x="530" y="20" width="450" height="120" rx="8" fill="#f6f8fa" stroke="#eb6834" stroke-width="1.8"/><text x="542" y="42" font-weight="600" fill="#1f2328">Event loop (numba)</text><text x="542" y="62" font-size="12" fill="#59636e">every 100 ms: strategy posts a bid and an ask</text><text x="542" y="78" font-size="12" fill="#59636e">quotes go live after 0 / 50 / 200 ms latency</text><text x="542" y="94" font-size="12" fill="#59636e">fill only if a trade prints THROUGH our price</text><text x="542" y="110" font-size="12" fill="#59636e">maker fee 0.02% on every fill</text>
<line x1="240" y1="80" x2="278" y2="80" stroke="#8c959f" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="490" y1="80" x2="528" y2="80" stroke="#8c959f" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="20" y="190" width="300" height="120" rx="8" fill="#f6f8fa" stroke="#1baf7a" stroke-width="1.8"/><text x="32" y="212" font-weight="600" fill="#1f2328">Strategies</text><text x="32" y="232" font-size="12" fill="#59636e">S0 naive: fixed half-spread around mid</text><text x="32" y="248" font-size="12" fill="#59636e">S1 Avellaneda-Stoikov: skew by inventory,</text><text x="32" y="264" font-size="12" fill="#59636e">     spread from volatility, constant sigma</text><text x="32" y="280" font-size="12" fill="#59636e">S2 S1 + live EWMA vol + inventory limits</text>
<rect x="360" y="190" width="290" height="120" rx="8" fill="#f6f8fa" stroke="#1baf7a" stroke-width="1.8"/><text x="372" y="212" font-weight="600" fill="#1f2328">Analytics</text><text x="372" y="232" font-size="12" fill="#59636e">PnL = spread capture + inventory - fees</text><text x="372" y="248" font-size="12" fill="#59636e">markouts 1 / 5 / 30 / 60 s</text><text x="372" y="264" font-size="12" fill="#59636e">inventory risk, hourly PnL, Sharpe</text><text x="372" y="280" font-size="12" fill="#59636e">hourly carry regression</text>
<rect x="690" y="190" width="290" height="120" rx="8" fill="#f6f8fa" stroke="#1baf7a" stroke-width="1.8"/><text x="702" y="212" font-weight="600" fill="#1f2328">Walk-forward</text><text x="702" y="232" font-size="12" fill="#59636e">tune on Mar 24-27 (grid search,</text><text x="702" y="248" font-size="12" fill="#59636e">     $5M/day volume obligation)</text><text x="702" y="264" font-size="12" fill="#59636e">report Mar 28-30 only</text><text x="702" y="280" font-size="12" fill="#59636e">latency + fee sensitivity</text>
<line x1="640" y1="140" x2="260" y2="188" stroke="#8c959f" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="320" y1="250" x2="358" y2="250" stroke="#8c959f" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="650" y1="250" x2="688" y2="250" stroke="#8c959f" stroke-width="1.6" marker-end="url(#ah)"/>
</svg>